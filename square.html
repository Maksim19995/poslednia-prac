<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>spasi i sochrani</title>
  <style>
    /*Адаптируем под весь экран 5 на 5 -сеточку*/
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
    }
    /*бахаем на весь экран сожержимое */
    .board {
      height: 100%;
      width: 100%;
    }

    .cell {
      display: inline-block;
      width: 20%;  
      text-align: center;
      aspect-ratio: 1 / 1; /*делаем квадарты одного размера*/
      line-height: calc(100vw / 5); 
    }

    /* чередовочка цеветов  */
    .cell:nth-child(odd) {
      background: #2b6cb0;
      color:#f6e05e;;
    }
    .cell:nth-child(even) {
      background: #f6e05e;
      color:#2b6cb0;
    }
  </style>
</head>
<body>
  <div class="board">
    <div class="cell">A</div><div class="cell">B</div><div class="cell">C</div><div class="cell">D</div><div class="cell">E</div>
    <div class="cell">F</div><div class="cell">G</div><div class="cell">H</div><div class="cell">I</div><div class="cell">J</div>
    <div class="cell">K</div><div class="cell">L</div><div class="cell">M</div><div class="cell">N</div><div class="cell">O</div>
    <div class="cell">P</div><div class="cell">Q</div><div class="cell">R</div><div class="cell">S</div><div class="cell">T</div>
    <div class="cell">U</div><div class="cell">V</div><div class="cell">W</div><div class="cell">X</div><div class="cell">Y</div>
  </div>
</body>
</html>
